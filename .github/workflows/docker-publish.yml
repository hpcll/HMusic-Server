name: Build & Publish HMusic release

# 触发：推 v* tag（如 vX.Y.Z）发正式版；也可在 Actions 页留空版本号做源码校验，
# 或填写与 package.json 一致的版本号发布当前选定分支。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：发布版本 tag，例如 v0.2.0；留空时仅验证源码"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # hpcll/HMusic-Server → 自动小写化后作镜像名

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HMUSIC_JWT_SECRET: ci-only-hmusic-jwt-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source and deployment scripts
        run: |
          npm run audit:prod
          npm run typecheck
          npm run test:deploy
          npm test
          npm run lint
          npm run build

  build-and-push:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送 GHCR 所需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU 让 amd64 的 runner 能交叉构建 arm64 镜像（含 better-sqlite3 原生编译）。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke test amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load -t hmusic-server:smoke .
          docker run -d --name hmusic-server-smoke --network host \
            -e HMUSIC_JWT_SECRET=release-smoke-test-secret \
            -e HMUSIC_PORT=16655 \
            hmusic-server:smoke
          trap 'docker rm -f hmusic-server-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16655/api/v1/system/info >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs hmusic-server-smoke
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 从 git ref 自动推导 tags：vX.Y.Z → X.Y.Z / X.Y / latest。
      # latest 在推 tag 时打上,确保 compose 里 :latest 能拉到最新版本。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=ref,event=tag

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存加速重复构建。
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-deployment-package:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build deployment package
        run: |
          PACKAGE_VERSION="$(node -e 'console.log(require("./package.json").version)')"
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if [ "v${PACKAGE_VERSION}" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG 与 package.json 版本 v${PACKAGE_VERSION} 不一致" >&2
            exit 1
          fi
          bash scripts/pack.sh

      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" hmusic-deploy.tar.gz hmusic-deploy.tar.gz.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" hmusic-deploy.tar.gz hmusic-deploy.tar.gz.sha256 \
              --generate-notes --title "$RELEASE_TAG"
          fi
