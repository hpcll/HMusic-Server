<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <!-- 添加到主屏幕后以独立 App 形态打开（无浏览器地址栏/工具栏遮挡） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HMusic" />
    <link rel="manifest" href="/app/manifest.json" />
    <title>HMusic</title>
    <link rel="icon" type="image/png" href="/app/assets/favicon-64.png" />
    <link rel="apple-touch-icon" href="/app/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "vue": "/app/vendor/vue.esm-browser.prod.js"
        }
      }
    </script>
    <script src="/app/vendor/qrcode.js"></script>
    <style>
      /* #app 占满视口，但为空时不占空间，让兜底可见 */
      #app { min-height: 100vh; }
      #app:empty { display: none; }
      #fallback { display: none; padding: 60px 20px; text-align: center; font-family: system-ui, sans-serif; color: #555; }
      #fallback h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; color: #333; }
      #fallback p { margin: 8px 0; font-size: 14px; line-height: 1.6; }
      #fallback code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="fallback">
      <h2>HMusic 加载失败</h2>
      <p>前端资源加载出错，可能是文件损坏或浏览器不兼容。</p>
      <p>你可以尝试：清除浏览器缓存后刷新，或更换现代浏览器（Chrome / Firefox / Edge）。</p>
      <p>如果问题持续，请联系管理员检查服务端 <code>web/</code> 目录。</p>
    </div>
    <script type="module" src="/app/main.js" onerror="document.getElementById('fallback').style.display='block';"></script>
    <script>
      window.addEventListener('error', (e) => {
        if (e.filename && e.filename.includes('/app/')) {
          document.getElementById('fallback').style.display = 'block';
        }
      }, true);
      setTimeout(() => {
        if (!document.getElementById('app').children.length) {
          document.getElementById('fallback').style.display = 'block';
        }
      }, 8000);
    </script>
  </body>
</html>
